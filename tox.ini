[tox]
envlist =
    coverage-erase
    py{3.15, 3.14, 3.13, 3.12, 3.11}
    flake8-main
    coverage-report
    build
    mypy-py{3.15, 3.14, 3.13, 3.12, 3.11}
labels =
    update=update-{requirements, pre_commit, headers}
    prep-release=prep-release

[testenv]
package = wheel
wheel_build_env = build_wheel
depends =
    py{3.15, 3.14, 3.13, 3.12, 3.11}: coverage-erase
deps = -r requirements/test/requirements.txt
commands =
    python assets/augment_pth_for_test_suite.py
    coverage run -m pytest {posargs}

[testenv:flake8-main]
base_python = py3.15
depends = coverage-erase
deps =
    -r requirements/test/requirements.txt
    uv
commands_pre =
    uv pip install git+https://github.com/pycqa/flake8.git
# `commands` is inherited from the default testenv, above.

[testenv:coverage-erase]
deps = -r requirements/test/requirements-coverage.txt
skip_install = true
commands =
    coverage erase

[testenv:coverage-report]
depends =
    py{3.15, 3.14, 3.13, 3.12, 3.11}
    flake8-main
deps = -r requirements/test/requirements-coverage.txt
skip_install = true
commands_pre =
    - coverage combine
commands =
    coverage report
commands_post =
    coverage html --fail-under=0

[testenv:mypy-py{3.15, 3.14, 3.13, 3.12, 3.11}]
deps = -r requirements/mypy/requirements.txt
setenv =
    MYPY_FORCE_COLOR=1
commands = mypy

[testenv:build]
base_python = py3.15
skip_install = true
deps =
    build
    twine
    uv
commands =
    python -m build --installer uv --outdir dist/
    twine check --strict dist/*

[testenv:update-requirements]
base_python = py3.15
description = Update dependencies and requirements
recreate = true
skip_install = true
deps =
    poetry
    poetry-plugin-export
commands =
    poetry update --directory="requirements/mypy" --lock
    poetry export --directory="requirements/mypy" --output="requirements.txt" --without-hashes
    poetry update --directory="requirements/test" --lock
    poetry export --directory="requirements/test" --output="requirements.txt" --without-hashes
    poetry export --directory="requirements/test" --output="requirements-coverage.txt" --without-hashes --only="coverage"

[testenv:update-pre_commit]
base_python = py3.15
description = Update pre-commit hooks
recreate = true
skip_install = true
deps =
    prek
    upadup
commands =
    prek autoupdate --freeze --cooldown-days 20
    upadup --freeze

[testenv:update-headers]
base_python = py3.15
description = Update headers
recreate = true
skip_install = true
deps =
    chipshot
commands =
    chipshot --update changelog.d/fragment-template.rst.jinja src/ requirements/README.rst tests/ CHANGELOG.rst README.rst

[testenv:prep-release]
description = Make the changes needed to create a new release PR
skip_install = true
deps =
    poetry
    scriv
passenv =
    VERSION
commands =
    poetry version "{env:VERSION}"
    scriv collect
